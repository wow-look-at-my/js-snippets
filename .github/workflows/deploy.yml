name: CI / Deploy

on: push

permissions:
  contents: read
  pages: write
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm, pinned via package.json "packageManager" and provisioned by
      # corepack (ships with Node) — no third-party setup action needed.
      - name: Enable pnpm
        run: corepack enable

      # No lockfile is committed (so ts0 is never pinned to a commit) — `pnpm
      # install` resolves the ts0 branch dependency to its current HEAD on every
      # run. ts0's git-dep build script is allowlisted via package.json
      # "pnpm.onlyBuiltDependencies".
      - run: pnpm install

      - name: Build
        # ts0 build type-checks (tsc --noEmit) and compiles src/ -> dist/;
        # the build script then assembles dist/llms.txt.
        run: pnpm build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
