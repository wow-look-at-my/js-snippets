# Runs the dag-view canvas vs SVG bench in Google Chrome on the org runner's GPU.
name: Bench (GPU)

on:
  push:
    branches: ['**']
    paths:
      - bench/**
      - scripts/run-bench.mjs
      - src/ui/dag-view*.ts
      - .github/workflows/bench-gpu.yml
  workflow_dispatch:

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  dag-render:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - name: Install just and Google Chrome
        run: |
          curl -fsSLo /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq just /tmp/chrome.deb
          google-chrome --version
      - name: GPU on this host
        run: nvidia-smi
      - run: just build-bench
      - name: Install playwright-core
        run: npm install --no-save --no-audit --no-fund --no-package-lock playwright-core@1.56.1
      - name: Bench, vsync off
        env:
          BENCH_CHROME: /usr/bin/google-chrome
          BENCH_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist --enable-gpu-rasterization --disable-gpu-vsync --disable-frame-rate-limit
          BENCH_REQUIRE_GPU: "1"
          BENCH_TIMEOUT_MS: "2400000"
        run: node scripts/run-bench.mjs 'bench/dist/dag-svg.html?auto&n=200,1000,3000,6000&frames=180'
