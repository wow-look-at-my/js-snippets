<!doctype html>
<meta charset="utf-8" />
<title>timeline pip draw: how many markers sustain 30fps?</title>
<!--
  How many instant pips (and spans) one frame can draw while SUSTAINING
  30fps, by draw method. The chart draws thousands of pips at wide zooms,
  so the question that matters is the ceiling, not the cost of any fixed
  count.

  Each candidate draws N diamonds per frame at positions that MOVE every
  frame — a pan — so no method gets to hide behind a buffer it uploaded
  once. Every row ramps N monotonically until real presented frames reach
  30+-3 fps, then FREEZES N and samples >=150 frames / >=5 s at that size:
  the number is backed by a sustained window, not by a handful of frames.
  See the driver comment below for why the ramp only ever goes up.

  Run: node scripts/run-bench.mjs bench/bench-gl.html
       (add ?warmup=0 to skip the 30 s thermal warmup while iterating)

  A GPU-less runner falls back to SwiftShader, which understates every GL
  row badly; the renderer string is reported so a result can never be read
  without knowing which machine produced it.
-->
<style>
	body { font: 13px ui-monospace, monospace; background: #14161a; color: #d6dde6; }
	canvas { display: block; margin: 4px 0; width: 600px; height: 300px; }
</style>
<canvas id="c2"></canvas>
<canvas id="gl"></canvas>
<pre id="out">running…</pre>
<script>
const DPR = 2, CSS_W = 1200, CSS_H = 600;
const W = CSS_W * DPR, H = CSS_H * DPR;
const R = 8, RX = R * 0.78, PAD = 3;
const FILL = '#7a94b7', BORDER = '#97adcd';
const BATCH = 32;             // the component's CLUSTER_BATCH_MAX
// Memory guard. Each method declares its per-marker allocation and gets its
// own ceiling out of one budget, because they differ by 30x: the instanced
// path uploads 8 B per marker and the GL path allocates 264 B (96 position +
// 48 colour + 120 index). One shared cap either strangles the cheap methods
// on a fast GPU or lets the expensive one allocate a gigabyte.
const N_CAP_HARD = 4_000_000;
const MEM_BUDGET = 384 * 1024 * 1024;
const capFor = (bytes) => Math.min(N_CAP_HARD, Math.floor(MEM_BUDGET / (bytes + 8)));

const SW = Math.ceil(RX * 2 + PAD * 2), SH = Math.ceil(R * 2 + PAD * 2);
const SPRITE_W = SW * DPR, SPRITE_H = SH * DPR;

function diamond(p, cx, cy, r, rx) {
	p.moveTo(cx, cy - r); p.lineTo(cx + rx, cy); p.lineTo(cx, cy + r); p.lineTo(cx - rx, cy); p.closePath();
}

// The baked glyph, shared by the canvas2d blit and the GL texture.
const glyph = document.createElement('canvas');
glyph.width = SPRITE_W; glyph.height = SPRITE_H;
{
	const g = glyph.getContext('2d');
	g.setTransform(DPR, 0, 0, DPR, 0, 0);
	g.fillStyle = FILL; g.strokeStyle = BORDER; g.lineWidth = 1;
	g.beginPath(); diamond(g, SW / 2, SH / 2, R, RX); g.fill(); g.stroke();
}

/** Marker positions for frame `f` — everything shifts, like a pan. */
function positions(n, f, out) {
	const cols = Math.max(1, Math.ceil(Math.sqrt(n * 2)));
	const dx = (CSS_W - 12) / cols;
	const rows = Math.ceil(n / cols);
	const dy = (CSS_H - 24) / Math.max(1, rows);
	const shift = (f % 17) * 0.31;
	for (let i = 0; i < n; i++) {
		out[i * 2] = 6 + ((i % cols) * dx + shift) % (CSS_W - 12);
		out[i * 2 + 1] = 12 + Math.floor(i / cols) * dy;
	}
	return out;
}

const c2 = document.getElementById('c2');
c2.width = W; c2.height = H;
const ctx = c2.getContext('2d');

function c2Batched(n, pts) {
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
	ctx.clearRect(0, 0, CSS_W, CSS_H);
	ctx.fillStyle = FILL; ctx.strokeStyle = BORDER; ctx.lineWidth = 1;
	for (let i = 0; i < n; i += BATCH) {
		const to = Math.min(i + BATCH, n);
		ctx.beginPath();
		for (let k = i; k < to; k++) diamond(ctx, pts[k * 2], pts[k * 2 + 1], R, RX);
		ctx.fill(); ctx.stroke();
	}
}
function c2PerPath(n, pts) {
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
	ctx.clearRect(0, 0, CSS_W, CSS_H);
	ctx.fillStyle = FILL; ctx.strokeStyle = BORDER; ctx.lineWidth = 1;
	for (let i = 0; i < n; i++) {
		ctx.beginPath(); diamond(ctx, pts[i * 2], pts[i * 2 + 1], R, RX);
		ctx.fill(); ctx.stroke();
	}
}
function c2Blit(n, pts) {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, W, H);
	for (let i = 0; i < n; i++) {
		ctx.drawImage(glyph, Math.round(pts[i * 2] * DPR - SPRITE_W / 2), Math.round(pts[i * 2 + 1] * DPR - SPRITE_H / 2));
	}
}

// ---------------------------------------------------------------- webgl2
const glc = document.getElementById('gl');
glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', { antialias: false, alpha: true });
let glMethods = {};
let renderer = 'n/a';
if (gl) {
	const compile = (type, src) => {
		const s = gl.createShader(type);
		gl.shaderSource(s, src); gl.compileShader(s);
		if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
		return s;
	};
	const link = (vs, fs) => {
		const p = gl.createProgram();
		gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
		gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
		gl.linkProgram(p);
		if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
		return p;
	};
	const FS = `#version 300 es
		precision mediump float;
		in vec2 v_uv;
		uniform sampler2D u_tex;
		out vec4 o;
		void main() { o = texture(u_tex, v_uv); }`;
	const instProg = link(`#version 300 es
		in vec2 a_corner;
		in vec2 a_center;
		uniform vec2 u_res;
		uniform vec2 u_size;
		out vec2 v_uv;
		void main() {
			v_uv = a_corner;
			vec2 px = a_center + (a_corner - 0.5) * u_size;
			vec2 clip = (px / u_res) * 2.0 - 1.0;
			gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
		}`, FS);
	const quadsProg = link(`#version 300 es
		in vec2 a_pos;
		in vec2 a_uv;
		uniform vec2 u_res;
		out vec2 v_uv;
		void main() {
			v_uv = a_uv;
			vec2 clip = (a_pos / u_res) * 2.0 - 1.0;
			gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
		}`, FS);

	const tex = gl.createTexture();
	gl.bindTexture(gl.TEXTURE_2D, tex);
	gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
	gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, glyph);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
	gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
	gl.enable(gl.BLEND);
	gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
	gl.viewport(0, 0, W, H);

	const quadBuf = gl.createBuffer();
	gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
	gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
	const instBuf = gl.createBuffer();
	const instVao = gl.createVertexArray();
	gl.bindVertexArray(instVao);
	gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
	gl.enableVertexAttribArray(gl.getAttribLocation(instProg, 'a_corner'));
	gl.vertexAttribPointer(gl.getAttribLocation(instProg, 'a_corner'), 2, gl.FLOAT, false, 0, 0);
	gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
	const aCenter = gl.getAttribLocation(instProg, 'a_center');
	gl.enableVertexAttribArray(aCenter);
	gl.vertexAttribPointer(aCenter, 2, gl.FLOAT, false, 0, 0);
	gl.vertexAttribDivisor(aCenter, 1);
	gl.bindVertexArray(null);

	const vertBuf = gl.createBuffer();
	const idxBuf = gl.createBuffer();
	const quadsVao = gl.createVertexArray();
	gl.bindVertexArray(quadsVao);
	gl.bindBuffer(gl.ARRAY_BUFFER, vertBuf);
	gl.enableVertexAttribArray(gl.getAttribLocation(quadsProg, 'a_pos'));
	gl.vertexAttribPointer(gl.getAttribLocation(quadsProg, 'a_pos'), 2, gl.FLOAT, false, 16, 0);
	gl.enableVertexAttribArray(gl.getAttribLocation(quadsProg, 'a_uv'));
	gl.vertexAttribPointer(gl.getAttribLocation(quadsProg, 'a_uv'), 2, gl.FLOAT, false, 16, 8);
	gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
	gl.bindVertexArray(null);

	// The GL counterpart of the canvas2d PATH draw: no texture, no quad —
	// the diamond as real geometry. 12 verts / 30 indices per marker: 4 for
	// the filled body, then an 8-vert ring standing in for the 1px stroke,
	// its inner and outer edges offset along the edge normals the way canvas
	// straddles a stroked path. Colour is a static per-vertex attribute
	// (uploaded once per resize), so a frame uploads positions and nothing
	// else — the same deal the quad methods get.
	const pathProg = link(`#version 300 es
		in vec2 a_pos;
		in vec4 a_color;
		uniform vec2 u_res;
		out vec4 v_color;
		void main() {
			v_color = a_color;
			vec2 clip = (a_pos / u_res) * 2.0 - 1.0;
			gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
		}`, `#version 300 es
		precision mediump float;
		in vec4 v_color;
		out vec4 o;
		void main() { o = v_color; }`);

	const VERTS_PER = 12, IDX_PER = 30;
	const PATH_OFFSETS = (() => {
		const ry = R * DPR, rx = RX * DPR;
		const L = Math.hypot(rx, ry), half = 0.5 * DPR;
		const ox = rx + (half * L) / ry, oy = ry + (half * L) / rx;
		const ix = rx - (half * L) / ry, iy = ry - (half * L) / rx;
		const ring = (x, y) => [0, -y, x, 0, 0, y, -x, 0];
		return new Float32Array([...ring(rx, ry), ...ring(ix, iy), ...ring(ox, oy)]);
	})();
	const PATH_INDICES = (() => {
		const idx = [0, 1, 2, 0, 2, 3];
		for (let k = 0; k < 4; k++) {
			const i0 = 4 + k, i1 = 4 + ((k + 1) % 4), o0 = 8 + k, o1 = 8 + ((k + 1) % 4);
			idx.push(i0, o0, o1, i0, o1, i1);
		}
		return idx;
	})();
	const rgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16), 255];

	const pathVertBuf = gl.createBuffer();
	const pathColBuf = gl.createBuffer();
	const pathIdxBuf = gl.createBuffer();
	const pathVao = gl.createVertexArray();
	gl.bindVertexArray(pathVao);
	gl.bindBuffer(gl.ARRAY_BUFFER, pathVertBuf);
	gl.enableVertexAttribArray(gl.getAttribLocation(pathProg, 'a_pos'));
	gl.vertexAttribPointer(gl.getAttribLocation(pathProg, 'a_pos'), 2, gl.FLOAT, false, 0, 0);
	gl.bindBuffer(gl.ARRAY_BUFFER, pathColBuf);
	gl.enableVertexAttribArray(gl.getAttribLocation(pathProg, 'a_color'));
	gl.vertexAttribPointer(gl.getAttribLocation(pathProg, 'a_color'), 4, gl.UNSIGNED_BYTE, true, 0, 0);
	gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, pathIdxBuf);
	gl.bindVertexArray(null);
	const uPathRes = gl.getUniformLocation(pathProg, 'u_res');

	let pathCap = 0, pathVerts = null;
	function reservePath(n) {
		if (n <= pathCap) return;
		pathCap = n;
		pathVerts = new Float32Array(n * VERTS_PER * 2);
		const col = new Uint8Array(n * VERTS_PER * 4);
		const fill = rgb(FILL), border = rgb(BORDER);
		for (let i = 0; i < n; i++) {
			for (let v = 0; v < VERTS_PER; v++) {
				const c = v < 4 ? fill : border;
				col.set(c, (i * VERTS_PER + v) * 4);
			}
		}
		const idx = new Uint32Array(n * IDX_PER);
		for (let i = 0; i < n; i++) {
			for (let k = 0; k < IDX_PER; k++) idx[i * IDX_PER + k] = i * VERTS_PER + PATH_INDICES[k];
		}
		gl.bindBuffer(gl.ARRAY_BUFFER, pathVertBuf);
		gl.bufferData(gl.ARRAY_BUFFER, pathVerts.byteLength, gl.DYNAMIC_DRAW);
		gl.bindBuffer(gl.ARRAY_BUFFER, pathColBuf);
		gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, pathIdxBuf);
		gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
	}

	const uInstRes = gl.getUniformLocation(instProg, 'u_res');
	const uInstSize = gl.getUniformLocation(instProg, 'u_size');
	const uInstTex = gl.getUniformLocation(instProg, 'u_tex');
	const uQuadRes = gl.getUniformLocation(quadsProg, 'u_res');
	const uQuadTex = gl.getUniformLocation(quadsProg, 'u_tex');

	let cap = 0, centers = null, verts = null;
	/** Size the GPU buffers for n markers (index buffer is static per size). */
	function reserve(n) {
		if (n <= cap) return;
		cap = n;
		centers = new Float32Array(n * 2);
		verts = new Float32Array(n * 16);
		const idx = new Uint32Array(n * 6);
		const pattern = [0, 1, 2, 2, 1, 3];
		for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) idx[i * 6 + k] = i * 4 + pattern[k];
		gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
		gl.bufferData(gl.ARRAY_BUFFER, centers.byteLength, gl.DYNAMIC_DRAW);
		gl.bindBuffer(gl.ARRAY_BUFFER, vertBuf);
		gl.bufferData(gl.ARRAY_BUFFER, verts.byteLength, gl.DYNAMIC_DRAW);
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
		gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
	}

	glMethods = {
		// One quad, one vec2 per instance: 8 bytes of upload per marker.
		'gl instanced quads': (n, pts) => {
			reserve(n);
			for (let i = 0; i < n; i++) {
				centers[i * 2] = Math.round(pts[i * 2] * DPR);
				centers[i * 2 + 1] = Math.round(pts[i * 2 + 1] * DPR);
			}
			gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
			gl.useProgram(instProg);
			gl.bindVertexArray(instVao);
			gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
			gl.bufferSubData(gl.ARRAY_BUFFER, 0, centers, 0, n * 2);
			gl.uniform2f(uInstRes, W, H);
			gl.uniform2f(uInstSize, SPRITE_W, SPRITE_H);
			gl.activeTexture(gl.TEXTURE0);
			gl.bindTexture(gl.TEXTURE_2D, tex);
			gl.uniform1i(uInstTex, 0);
			gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
			gl.bindVertexArray(null);
		},
		// 4 verts (pos+uv) and 6 indices per marker: 64 bytes of upload.
		'gl vert+index 4v/6i': (n, pts) => {
			reserve(n);
			const hw = SPRITE_W / 2, hh = SPRITE_H / 2;
			for (let i = 0; i < n; i++) {
				const x = Math.round(pts[i * 2] * DPR), y = Math.round(pts[i * 2 + 1] * DPR);
				const o = i * 16;
				verts[o] = x - hw; verts[o + 1] = y - hh; verts[o + 2] = 0; verts[o + 3] = 0;
				verts[o + 4] = x + hw; verts[o + 5] = y - hh; verts[o + 6] = 1; verts[o + 7] = 0;
				verts[o + 8] = x - hw; verts[o + 9] = y + hh; verts[o + 10] = 0; verts[o + 11] = 1;
				verts[o + 12] = x + hw; verts[o + 13] = y + hh; verts[o + 14] = 1; verts[o + 15] = 1;
			}
			gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
			gl.useProgram(quadsProg);
			gl.bindVertexArray(quadsVao);
			gl.bindBuffer(gl.ARRAY_BUFFER, vertBuf);
			gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts, 0, n * 16);
			gl.uniform2f(uQuadRes, W, H);
			gl.activeTexture(gl.TEXTURE0);
			gl.bindTexture(gl.TEXTURE_2D, tex);
			gl.uniform1i(uQuadTex, 0);
			gl.drawElements(gl.TRIANGLES, n * 6, gl.UNSIGNED_INT, 0);
			gl.bindVertexArray(null);
		},
		// The diamond as geometry, not as a picture of one: 12 verts and 30
		// indices per marker, 96 bytes of position upload.
		'gl path 12v/30i': (n, pts) => {
			reservePath(n);
			for (let i = 0; i < n; i++) {
				const x = Math.round(pts[i * 2] * DPR), y = Math.round(pts[i * 2 + 1] * DPR);
				const o = i * VERTS_PER * 2;
				for (let v = 0; v < VERTS_PER; v++) {
					pathVerts[o + v * 2] = x + PATH_OFFSETS[v * 2];
					pathVerts[o + v * 2 + 1] = y + PATH_OFFSETS[v * 2 + 1];
				}
			}
			gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
			gl.useProgram(pathProg);
			gl.bindVertexArray(pathVao);
			gl.bindBuffer(gl.ARRAY_BUFFER, pathVertBuf);
			gl.bufferSubData(gl.ARRAY_BUFFER, 0, pathVerts, 0, n * VERTS_PER * 2);
			gl.uniform2f(uPathRes, W, H);
			gl.drawElements(gl.TRIANGLES, n * IDX_PER, gl.UNSIGNED_INT, 0);
			gl.bindVertexArray(null);
		},
	};
	const dbg = gl.getExtension('WEBGL_debug_renderer_info');
	renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
}
// ---------------------------------------------------------------- spans
// The other half of the chart is BARS: rounded rects with a fill, a 1px
// border, and sometimes a 45-degree hatch. The question is whether a
// 9-patch — cap, middle, cap, blitted from a baked strip — beats drawing
// the path. It splits on the fill: a solid middle is one stretched blit,
// but a hatched middle CANNOT stretch (it would smear the diagonal), so it
// has to tile at the hatch period and the blit count grows with the bar.
const BAR_H = 18, BAR_R = 3, CAP = BAR_R + 1, HATCH_PERIOD = 5;

/** Deterministic bar widths, 40..300 CSS px. */
function barWidth(i) {
	return 40 + ((i * 37) % 261);
}

function barPath(c, x, y, w, h) {
	c.beginPath();
	c.roundRect(x, y, w, h, BAR_R);
}

const hatchPattern = (() => {
	const p = document.createElement('canvas');
	p.width = HATCH_PERIOD * DPR; p.height = HATCH_PERIOD * DPR;
	const pc = p.getContext('2d');
	pc.setTransform(DPR, 0, 0, DPR, 0, 0);
	pc.strokeStyle = BORDER; pc.lineWidth = 2;
	pc.beginPath(); pc.moveTo(-HATCH_PERIOD, HATCH_PERIOD); pc.lineTo(HATCH_PERIOD, -HATCH_PERIOD); pc.stroke();
	pc.beginPath(); pc.moveTo(0, HATCH_PERIOD * 2); pc.lineTo(HATCH_PERIOD * 2, 0); pc.stroke();
	return ctx.createPattern(p, 'repeat');
})();

function spanPath(n, pts, hatched) {
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
	ctx.clearRect(0, 0, CSS_W, CSS_H);
	ctx.strokeStyle = BORDER; ctx.lineWidth = 1;
	for (let i = 0; i < n; i++) {
		const w = barWidth(i);
		barPath(ctx, pts[i * 2], pts[i * 2 + 1], w, BAR_H);
		ctx.fillStyle = FILL;
		ctx.fill();
		if (hatched) {
			ctx.save();
			ctx.clip();
			ctx.fillStyle = hatchPattern;
			ctx.fillRect(pts[i * 2], pts[i * 2 + 1], w, BAR_H);
			ctx.restore();
			barPath(ctx, pts[i * 2], pts[i * 2 + 1], w, BAR_H);
		}
		ctx.stroke();
	}
}

/** Bake [leftCap | middle | rightCap] once, at device resolution. */
function bakeStrip(hatched) {
	const midW = hatched ? HATCH_PERIOD : 1;
	const w = CAP * 2 + midW;
	const s = document.createElement('canvas');
	s.width = Math.ceil(w * DPR); s.height = Math.ceil(BAR_H * DPR);
	const sc = s.getContext('2d');
	sc.setTransform(DPR, 0, 0, DPR, 0, 0);
	// Draw a bar far wider than the strip and let the strip window it, so
	// the caps carry the real corner geometry and the middle is seamless.
	sc.save();
	sc.beginPath();
	sc.roundRect(0.5, 0.5, w - 1, BAR_H - 1, BAR_R);
	sc.fillStyle = FILL;
	sc.fill();
	if (hatched) {
		sc.save(); sc.clip();
		sc.fillStyle = hatchPattern;
		sc.fillRect(0, 0, w, BAR_H);
		sc.restore();
		sc.beginPath();
		sc.roundRect(0.5, 0.5, w - 1, BAR_H - 1, BAR_R);
	}
	sc.strokeStyle = BORDER; sc.lineWidth = 1;
	sc.stroke();
	sc.restore();
	return { img: s, capPx: CAP, midPx: midW };
}
const stripSolid = bakeStrip(false);
const stripHatch = bakeStrip(true);

// `snap` is the whole comparison, not a detail. Snapping every bar to whole
// device pixels keeps the blits crisp and unresampled, and it is what a
// naive 9-patch row measures — but a chart that pans by fractional pixels
// cannot snap per bar without every bar jittering against its neighbours,
// so the useful number is the sub-pixel one. The path row has always drawn
// at the raw fractional position; comparing it against a snapped 9-patch is
// comparing two different jobs.
function span9Patch(n, pts, hatched, snap) {
	const strip = hatched ? stripHatch : stripSolid;
	const { img, capPx, midPx } = strip;
	const sCap = capPx * DPR, sMid = midPx * DPR, sH = BAR_H * DPR;
	const q = snap ? Math.round : (v) => v;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, W, H);
	for (let i = 0; i < n; i++) {
		const x = q(pts[i * 2] * DPR), y = q(pts[i * 2 + 1] * DPR);
		const w = q(barWidth(i) * DPR);
		const midW = w - sCap * 2;
		ctx.drawImage(img, 0, 0, sCap, sH, x, y, sCap, sH);
		if (midW > 0) {
			if (hatched) {
				// Tiled: a 45-degree hatch smears if stretched, so the
				// middle repeats at its period — blits grow with width.
				for (let o = 0; o < midW; o += sMid) {
					const tw = Math.min(sMid, midW - o);
					ctx.drawImage(img, sCap, 0, tw, sH, x + sCap + o, y, tw, sH);
				}
			} else {
				ctx.drawImage(img, sCap, 0, sMid, sH, x + sCap, y, midW, sH);
			}
		}
		ctx.drawImage(img, sCap + sMid, 0, sCap, sH, x + w - sCap, y, sCap, sH);
	}
}

// [label, draw(n, positions), isGl, bytesPerMarker] — isGl routes the row
// through the GPU timer when one exists, which is the only way to see past
// vsync; the byte count sizes that row's own ceiling (see capFor).
const GL_BYTES = {
	'gl instanced quads': 8,
	'gl vert+index 4v/6i': 88,
	'gl path 12v/30i': 264,
};
const METHODS = [
	['canvas2d path, batched 32', c2Batched, false, 0],
	['canvas2d path, one each', c2PerPath, false, 0],
	['canvas2d sprite blit', c2Blit, false, 0],
	...Object.entries(glMethods).map(([name, fn]) => [name, fn, true, GL_BYTES[name] ?? 0]),
	['span path, solid', (n, p) => spanPath(n, p, false), false, 0],
	['span 9-patch solid, snapped', (n, p) => span9Patch(n, p, false, true), false, 0],
	['span 9-patch solid, subpx', (n, p) => span9Patch(n, p, false, false), false, 0],
	['span path, hatched', (n, p) => spanPath(n, p, true), false, 0],
	['span 9-patch hatch, snapped', (n, p) => span9Patch(n, p, true, true), false, 0],
	['span 9-patch hatch, subpx', (n, p) => span9Patch(n, p, true, false), false, 0],
];


// ---------------------------------------------------------------- driver
// Ported from PazerOP/scratch scratchpads/gpu-benchmark/bench.ts, which
// solved this problem already. The shape matters and the reasons are not
// obvious:
//
//   0. Thermal warmup, once: ramping load until the GPU's clocks and
//      temperature settle. A cold GPU boosts, so the first measurement of
//      a run reads high and every later one looks like a regression.
//   1. Per-method warmup frames: shader compile, the first buffer upload
//      and the canvas' first raster all land here and none of them recur.
//   2. Ramp, MONOTONIC: raise the marker count until the frame time
//      reaches the 30fps band. It never steps back down. A search that
//      moves both ways gets one slow reading — a GC pause, a compositor
//      hiccup — and converges on a number nowhere near the truth, which
//      is exactly what a binary search over this signal produced.
//   3. Sample: FREEZE the count and collect SAMPLE_FRAMES contiguous
//      frames, at least SAMPLE_MIN_MS of them. The reported figure is
//      backed by that sustained window, not by a handful of frames.
//
// Timing source: with a GPU timer (EXT_disjoint_timer_query_webgl2) the
// loop runs off setTimeout so it is NOT gated by vsync, and dt is the
// GPU's own execution time. Without one it falls back to rAF wall-clock,
// where vsync quantises everything to the refresh interval and hides the
// GPU falling behind — hence the much tighter step clamp on that path, so
// the ramp cannot overshoot the vsync cliff by multiples.

const TARGET_FPS = 30;
const TARGET_MS = 1000 / TARGET_FPS;
const BAND_FPS = 3;                    // acceptance band around the target
const THERMAL_WARMUP_MS = 30000;
const WARMUP_FRAMES = 5;
const CONTROL_GAIN = 0.05;
const CONTROL_STEP_FLOOR = 0.05;
const CONTROL_STEP_CLAMP = 0.2;        // per ramp frame, GPU-timed
const CONTROL_STEP_CLAMP_RAF = 0.01;   // tighter: rAF hides the overshoot
const CONTROL_WINDOW = 7;              // frames the ramp decides on (median)
const MAX_RERAMPS = 6;                 // sample-verify rounds before giving up
const NOTE_INTERVAL_MS = 250;          // progress writes: a DOM write per frame IS measurable load
const SAMPLE_FRAMES = 150;             // 5 s at 30 fps
const SAMPLE_MIN_MS = 5000;
const RAMP_TIMEOUT_MS = 45000;
const N_MIN = 64;

const params = new URLSearchParams(location.search);
const thermalMs = Number(params.get('warmup') ?? THERMAL_WARMUP_MS);

// GPU timing, WebGL2 only. SwiftShader does not advertise it, so a
// GPU-less runner takes the rAF path and says so in the output.
const timerExt = gl ? gl.getExtension('EXT_disjoint_timer_query_webgl2') : null;
const TIMER_SLOTS = 4;
let timerRing = [];
let timerHead = 0;
let timerTail = 0;
function timerSlotFree() {
	return timerRing.length < TIMER_SLOTS;
}
function beginGpuTimer() {
	if (!timerExt || !timerSlotFree()) return false;
	const q = gl.createQuery();
	gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q);
	timerRing.push(q);
	return true;
}
function endGpuTimer(started) {
	if (started) gl.endQuery(timerExt.TIME_ELAPSED_EXT);
}
/** Oldest finished GPU time in ms, or null. */
function pollGpuTime() {
	if (!timerExt || timerRing.length === 0) return null;
	const q = timerRing[0];
	if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) return null;
	if (gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
		timerRing.shift();
		gl.deleteQuery(q);
		return null;
	}
	const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
	timerRing.shift();
	gl.deleteQuery(q);
	return ns / 1e6;
}

let scratch = new Float32Array(2);
function ensure(n) {
	if (scratch.length < n * 2) scratch = new Float32Array(n * 2);
	return scratch;
}

/**
 * Ramp `draw` to the 30fps band, freeze, and sample a sustained window.
 * Resolves { n, fps, frames, seconds, timing, pinned }.
 */
function measure(draw, isGl, note, cap) {
	return new Promise((resolve) => {
		// GPU timing only helps the GL methods; canvas2d work is CPU-side
		// and the extension would time an empty GPU queue.
		let useGpu = isGl && !!timerExt;
		let gpuResults = 0;
		const gpuDeadline = useGpu ? performance.now() + 2000 : 0;

		let nF = N_MIN;
		let n = N_MIN;
		let pinned = false;
		let phase = 'warmup';
		let warmed = 0;
		let prevTs = null;
		const ctrl = [];
		let reramps = 0;
		let lastNote = 0;
		const sample = [];
		let sampleStart = 0;
		let rampStart = performance.now();

		const tick = (rafTs) => {
			const ts = useGpu ? performance.now() : (rafTs ?? performance.now());
			const gpuMs = useGpu ? pollGpuTime() : null;
			if (gpuMs !== null && gpuMs > 0) gpuResults++;
			// A timer that only ever yields zeros is not a working timer.
			if (useGpu && gpuResults === 0 && ts > gpuDeadline) {
				useGpu = false;
				note('gpu timer yielded nothing — falling back to rAF');
			}

			const render = !useGpu || timerSlotFree();
			if (render) {
				const started = useGpu ? beginGpuTimer() : false;
				draw(n, positions(n, warmed, ensure(n)));
				endGpuTimer(started);
			}

			let dt = 0;
			if (gpuMs !== null) dt = gpuMs;
			else if (!useGpu && prevTs !== null) dt = ts - prevTs;
			prevTs = ts;

			if (phase === 'warmup') {
				if (++warmed >= WARMUP_FRAMES) phase = 'ramp';
			} else if (dt > 0) {
				if (phase === 'ramp') {
					// The control signal is the MEDIAN of the last few frames,
					// never one frame. A monotonic ramp terminates the moment it
					// sees an in-band reading, so a single hiccup — a GC pause,
					// the compositor picking up other work — would freeze the
					// workload far below the real ceiling and report it as the
					// answer. That is exactly what one-frame control produced:
					// every row settling at 60fps, which is not the band at all.
					ctrl.push(dt);
					if (ctrl.length > CONTROL_WINDOW) ctrl.shift();
					if (ctrl.length < CONTROL_WINDOW) {
						requestAnimationFrame(tick);
						return;
					}
					const sortedCtrl = ctrl.slice().sort((a, b) => a - b);
					const ctrlMs = sortedCtrl[sortedCtrl.length >> 1];
					const fps = 1000 / ctrlMs;
					dt = ctrlMs;
					if (fps > TARGET_FPS + BAND_FPS && !pinned) {
						const gain = Math.abs(Math.pow(TARGET_MS / dt, CONTROL_GAIN) - 1);
						const edge = TARGET_FPS + BAND_FPS;
						const proximity = Math.min(1, Math.max(0, (fps - edge) / edge));
						const floor = CONTROL_STEP_FLOOR * proximity;
						const clamp = useGpu ? CONTROL_STEP_CLAMP : CONTROL_STEP_CLAMP_RAF;
						nF = Math.min(cap, nF * (1 + Math.min(clamp, Math.max(floor, gain))));
						n = Math.max(1, Math.round(nF));
						if (nF >= cap - 0.5) pinned = true;
						// Throttled: writing progress every ramp frame costs a
						// layout and a paint that the frozen sample does not pay,
						// so the ramp measures its own instrumentation and stops
						// early. That alone was freezing rows at 60fps.
						if (ts - lastNote > NOTE_INTERVAL_MS) {
							lastNote = ts;
							note(`ramping n=${n} (${fps.toFixed(1)} fps)`);
						}
					} else {
						phase = 'sample';
						sampleStart = ts;
						note(`sampling n=${n} for ${(SAMPLE_MIN_MS / 1000).toFixed(0)}s`);
					}
					if (ts - rampStart > RAMP_TIMEOUT_MS) {
						phase = 'sample';
						sampleStart = ts;
					}
				} else {
					sample.push(dt);
					if (sample.length >= SAMPLE_FRAMES && ts - sampleStart >= SAMPLE_MIN_MS) {
						const sorted = sample.slice().sort((a, b) => a - b);
						const median = sorted[sorted.length >> 1];
						const fps = 1000 / median;
						// The sample VERIFIES the ramp. If the frozen workload
						// sustains faster than the band, the ramp stopped short —
						// under vsync the signal is quantised to the refresh
						// interval, so a workload sitting just under the cliff
						// reads as over it for a few frames and then settles back.
						// Resume ramping (n never decreases) rather than report a
						// ceiling the sustained window just contradicted.
						if (fps > TARGET_FPS + BAND_FPS && !pinned && reramps < MAX_RERAMPS) {
							reramps++;
							phase = 'ramp';
							ctrl.length = 0;
							sample.length = 0;
							// The deadline is PER ramp round. Left un-reset it
							// has already expired by the time the first sample
							// ends, so every resumed round flipped straight back
							// to sampling after one control window and the row
							// reported a floor as a ceiling: the GL path row
							// resolved at 97k markers sustaining 120fps, four
							// times the target, and the table printed it plain.
							rampStart = ts;
							note(`n=${n} sustained ${fps.toFixed(1)} fps — resuming ramp`);
						} else {
							resolve({
								n,
								fps,
								frames: sample.length,
								seconds: (ts - sampleStart) / 1000,
								timing: useGpu ? 'gpu-timer' : 'rAF',
								pinned,
								reramps,
							});
							return;
						}
					}
				}
			}

			if (useGpu) setTimeout(tick, 0);
			else requestAnimationFrame(tick);
		};
		requestAnimationFrame(tick);
	});
}

/** Ramping load until the silicon settles. Nothing is collected. */
function thermalWarmup(note) {
	if (!(thermalMs > 0)) return Promise.resolve();
	return new Promise((resolve) => {
		const draw = METHODS[0][1];
		let nF = N_MIN, n = N_MIN, prev = null, f = 0;
		const start = performance.now();
		const tick = (ts) => {
			draw(n, positions(n, f++, ensure(n)));
			const dt = prev === null ? 0 : ts - prev;
			prev = ts;
			if (dt > 0 && 1000 / dt > TARGET_FPS + BAND_FPS) {
				nF = Math.min(capFor(METHODS[0][3]), nF * 1.01);
				n = Math.max(1, Math.round(nF));
			}
			const left = (thermalMs - (ts - start)) / 1000;
			if (left > 0) {
				note(`thermal warmup ${left.toFixed(0)}s (n=${n})`);
				requestAnimationFrame(tick);
			} else resolve();
		};
		requestAnimationFrame(tick);
	});
}

const rows = [];
async function run() {
	const out = document.getElementById('out');
	const note = (what) => { out.textContent = what; };
	await thermalWarmup(note);
	for (const [name, draw, isGl, bytes] of METHODS) {
		const r = await measure(draw, !!isGl, (what) => note(`${name}: ${what}`), capFor(bytes));
		rows.push({ name, ...r });
		note(`${rows.length}/${METHODS.length} — ${name}: ${r.n} @ ${r.fps.toFixed(1)} fps`);
	}
	const res = { renderer, target: TARGET_FPS, band: BAND_FPS, rows };
	window.__results = res;
	out.textContent =
		`renderer: ${renderer}\n` +
		`each row: markers ramped until frames hit ${TARGET_FPS}+-${BAND_FPS} fps, then frozen and sampled\n\n` +
		`  ${'method'.padEnd(26)} ${'markers'.padStart(9)}  ${'fps'.padStart(6)}  ${'markers/s'.padStart(11)}   sample\n` +
		rows
			.map((r) => {
				const rate = Math.round(r.n * r.fps);
				// n == N_MIN means the method could not hold the band even at the
				// smallest size, so its fixed per-frame cost — not the markers —
				// is what is being measured. Saying so beats printing a marker
				// count that has nothing to do with markers.
				// A row that sampled outside the band never converged, so its
				// marker count is not a ceiling and must not read as one.
				const flag = r.pinned
					? '  <- pinned at the size cap, never reached the band'
					: r.n <= N_MIN
						? '  <- floored: over budget at the SMALLEST size; fixed per-frame cost dominates, not the markers'
						: r.fps > TARGET_FPS + BAND_FPS
							? `  <- NEVER CONVERGED after ${r.reramps} re-ramps: sustained ${r.fps.toFixed(0)} fps, so this is a FLOOR, not a ceiling`
							: '';
				return `  ${r.name.padEnd(26)} ${String(r.n).padStart(9)}  ${r.fps.toFixed(1).padStart(6)}  ${String(rate).padStart(11)}   ${r.frames}f/${r.seconds.toFixed(1)}s ${r.timing}${flag}`;
			})
			.join('\n');
}
addEventListener('load', () => setTimeout(run, 0));
</script>
